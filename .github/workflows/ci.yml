name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # Fast suite only -- pytest.ini's `addopts = -m "not slow"` already
      # excludes the real Hugging Face Turkish NER integration tests by
      # default, so this is the same command documented in the README.
      # Those slow tests need network access and a model download and
      # are intentionally not run in CI (see README "Tests").
      - name: Run fast test suite
        run: python -m pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest runners report ~14GB free; the optimized backend
      # image (1.82GB, CPU-only torch) plus the frontend's node build
      # stage and nginx:alpine comfortably fit, but this makes actual
      # usage visible in the log instead of assuming it.
      - name: Available disk space (informational)
        run: df -h /

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      # /health does not load the NER pipeline (it's lazy-loaded only on
      # a real analyze request, see turkish_ner.get_ner_pipeline), so
      # this never triggers a Hugging Face model download. A short
      # retry loop covers normal container startup time only.
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy within 60s" >&2
          exit 1

      - name: Smoke test frontend
        run: curl --fail http://localhost:8080/

      - name: Smoke test real OCR pipeline
        run: |
          docker compose exec -T backend sh -eu -c '
            languages="$(tesseract --list-langs 2>&1)"
            printf "%s\n" "$languages"
            printf "%s\n" "$languages" | grep -qx eng
            printf "%s\n" "$languages" | grep -qx tur
          '
          docker compose exec -T \
            -e HF_HUB_OFFLINE=1 \
            -e TRANSFORMERS_OFFLINE=1 \
            backend python - <<'PY'
          from pathlib import Path

          import pymupdf

          from backend.app.services import detection_engine
          from backend.app.services.document_processing import (
              analyze_document_file,
          )
          from backend.app.services.pdf_parser import extract_text_from_pdf


          pdf_path = Path("/tmp/ocr-ci-smoke.pdf")

          image_document = pymupdf.open()
          image_page = image_document.new_page(width=500, height=180)
          image_page.insert_text(
              (45, 95),
              "test@example.com",
              fontsize=32,
              color=(0, 0, 0),
          )
          image_bytes = image_page.get_pixmap(
              matrix=pymupdf.Matrix(3, 3),
              alpha=False,
          ).tobytes("png")
          image_document.close()

          scanned_document = pymupdf.open()
          scanned_page = scanned_document.new_page(width=500, height=180)
          scanned_page.insert_image(scanned_page.rect, stream=image_bytes)
          assert scanned_page.get_text("text").strip() == ""
          scanned_document.save(pdf_path)
          scanned_document.close()

          parsed = extract_text_from_pdf(pdf_path)
          parsed_page = parsed["pages"][0]
          assert parsed_page["text_source"] == "ocr"
          assert "test@example.com" in parsed_page["text"]

          # Keep this smoke check offline: EMAIL is rule-based, so the
          # Hugging Face NER model must not be loaded or downloaded.
          detection_engine.detect_named_entities = lambda text: []

          analysis = analyze_document_file(
              pdf_path=pdf_path,
              docx_path=Path("/tmp/missing.docx"),
              xlsx_path=Path("/tmp/missing.xlsx"),
          )
          email_finding = next(
              finding
              for finding in analysis["findings"]
              if finding["type"] == "EMAIL"
          )
          assert email_finding["value"] == "test@example.com"
          assert email_finding["bounding_boxes"]

          print(
              "OCR smoke passed:",
              parsed_page["text"].strip(),
              email_finding["bounding_boxes"],
          )
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      # Runs even if a build/smoke step above failed, so containers
      # never linger on the runner.
      - name: Tear down
        if: always()
        run: docker compose down
